<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D1B69"/>
      <stop offset="100%" stop-color="#0D0721"/>
    </linearGradient>
    <linearGradient id="outerGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="20" fill="url(#bgGrad)"/>

  <!-- Outer glow halo -->
  <path d="M18,12 C13,12 10,16 10,21 L10,79 C10,84 13,88 18,88 C20.5,88 23,87 25,85.5 L87,53 C90,51.5 90,48.5 87,47 L25,14.5 C23,13 20.5,12 18,12 Z"
        fill="url(#outerGrad)" filter="url(#outerGlow)" opacity="0.35"/>

  <!-- Outer triangle body -->
  <path d="M18,12 C13,12 10,16 10,21 L10,79 C10,84 13,88 18,88 C20.5,88 23,87 25,85.5 L87,53 C90,51.5 90,48.5 87,47 L25,14.5 C23,13 20.5,12 18,12 Z"
        fill="url(#outerGrad)"/>

  <!-- Dark inner cutout -->
  <path d="M22,22 C18,22 15.5,25 15.5,29 L15.5,71 C15.5,75 18,78 22,78 C23.8,78 25.5,77.2 27,76 L74,52 C76.5,50.5 76.5,49.5 74,48 L27,24 C25.5,22.8 23.8,22 22,22 Z"
        fill="#0D0721"/>

  <!-- Inner accent triangle -->
  <path d="M26,30 C23,30 21,33 21,36 L21,64 C21,67 23,70 26,70 C27.5,70 29,69.4 30.3,68.3 L63,52 C64.8,51 64.8,49 63,48 L30.3,31.7 C29,30.6 27.5,30 26,30 Z"
        fill="url(#innerGrad)" filter="url(#glow)"/>

  <!-- Center eye — dark ring -->
  <circle cx="50" cy="50" r="10" fill="#0D0721"/>
  <!-- Center eye — glowing dot -->
  <circle cx="50" cy="50" r="6" fill="#D946EF" filter="url(#glow)"/>
  <!-- Center highlight -->
  <circle cx="50" cy="50" r="2.5" fill="#F0ABFC"/>
</svg>
