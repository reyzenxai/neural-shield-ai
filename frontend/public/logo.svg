<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="g-outer" x1="12" y1="14" x2="88" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0ABFC"/>
      <stop offset="40%" stop-color="#C084FC"/>
      <stop offset="80%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="g-mid" x1="25" y1="28" x2="76" y2="73" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="g-inner" x1="36" y1="41" x2="65" y2="67" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0ABFC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <radialGradient id="g-dot" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F0ABFC"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </radialGradient>
    <radialGradient id="g-shine" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer rounded triangle: top(50,13) BR(88,80) BL(12,80) corner-r≈12 -->
  <path d="M44,24 Q50,13 56,24 L82,70 Q88,80 76,80 L24,80 Q12,80 18,70 Z"
        fill="url(#g-outer)"/>

  <!-- Shine overlay for 3-D top-left highlight -->
  <path d="M44,24 Q50,13 56,24 L66,42 Q54,27 44,24 Z"
        fill="url(#g-shine)"/>

  <!-- Dark cavity (scale≈0.68 from centroid 50,58) -->
  <path d="M44.5,37 Q50,28 55.5,37 L71,64 Q76,73 68,73 L32,73 Q24,73 29,64 Z"
        fill="#0D0721"/>

  <!-- Mid purple ring inside dark cavity -->
  <path d="M46,41.5 Q50,35 54,41.5 L67,63 Q70.5,69 65,69 L35,69 Q29.5,69 33,63 Z"
        fill="url(#g-mid)" opacity="0.85"/>

  <!-- Innermost triangle -->
  <path d="M47.5,47 Q50,42.5 52.5,47 L61.5,62.5 Q63.8,66.5 59,66.5 L41,66.5 Q36.2,66.5 38.5,62.5 Z"
        fill="#0D0721"/>

  <!-- Center glowing sphere -->
  <circle cx="50" cy="59.5" r="3.6" fill="url(#g-dot)"/>
</svg>
