name: CI

on:
  push:
    branches: [main, develop, pranjal-dev, ritik-dev]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The repo is an npm workspace (frontend, backend, packages/*), so install once
  # at the root and run each app's scripts through the workspace. Mobile and the
  # extension build on their own and are not part of this workspace yet.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      # npm install (not ci) so the Linux runner resolves its own platform-specific
      # native optional deps (lightningcss, swc). The lockfile is generated on a
      # different OS, and npm ci does not reliably install cross-platform optionals.
      - run: npm install --no-audit --no-fund
      - run: npm run type-check --workspace=frontend
      - run: npm run lint --workspace=frontend
      - run: npm run build --workspace=frontend
        env:
          # Public build-time values; the app guards missing Supabase env at runtime.
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      # npm install (not ci) so the Linux runner resolves its own platform-specific
      # native optional deps (lightningcss, swc). The lockfile is generated on a
      # different OS, and npm ci does not reliably install cross-platform optionals.
      - run: npm install --no-audit --no-fund
      - run: npm run type-check --workspace=backend
      - run: npm run lint --workspace=backend
      - run: npm run test --workspace=backend
      - run: npm run build --workspace=backend
