# Local container stack for the Neural Shield backend API.
# The frontend runs best with `cd frontend && npm run dev` (or deploys to Vercel).
#
#   docker compose -f docker-compose.dev.yml up --build
#
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: neural-shield-backend:dev
    container_name: neural-shield-backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
