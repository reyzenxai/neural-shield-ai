<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural Shield AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #0d0721;
      color: #e2e8f0;
    }
    .header {
      background: linear-gradient(135deg, #2d1b69 0%, #4c1d95 50%, #581c87 100%);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(168, 85, 247, 0.25);
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 120% at 10% 50%, rgba(168,85,247,0.18), transparent 60%);
      pointer-events: none;
    }
    .header-logo {
      width: 26px; height: 26px;
      flex-shrink: 0;
      filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.7));
      position: relative;
    }
    .header-title { font-size: 14px; font-weight: 600; color: #fff; letter-spacing: -0.01em; }
    .header-badge {
      font-size: 9px; font-weight: 700; font-family: monospace;
      background: rgba(168, 85, 247, 0.2);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 4px;
      padding: 1px 5px;
      letter-spacing: 0.04em;
    }
    .header-sub { font-size: 10px; color: #a78bfa; margin-left: auto; }

    .body { padding: 14px 16px; }

    /* URL strip */
    .url-strip {
      background: #1a0d35;
      border: 1px solid rgba(168, 85, 247, 0.15);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      color: #94a3b8;
    }

    /* Sign-in prompt */
    .signin-box { text-align: center; padding: 16px 0; }
    .signin-box p { color: #94a3b8; margin-bottom: 12px; font-size: 12px; }
    .btn {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: linear-gradient(135deg, #7c3aed, #a855f7); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid rgba(168, 85, 247, 0.3); color: #a78bfa; }
    .btn-danger { background: #ef4444; color: #fff; }

    /* Loading */
    .loading { text-align: center; padding: 24px; color: #64748b; font-size: 12px; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #1a0d35;
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Verdict card */
    .verdict-card {
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      border-left: 4px solid var(--risk-color, #6b7280);
      background: #1a0d35;
    }
    .verdict-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .verdict-badge {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: var(--risk-color, #6b7280);
      color: #fff;
    }
    .verdict-score { font-size: 11px; color: #64748b; margin-left: auto; }
    .verdict-label { font-size: 13px; font-weight: 600; color: #f1f5f9; }

    /* Confidence bar */
    .conf-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .conf-label { font-size: 10px; color: #64748b; width: 60px; flex-shrink: 0; }
    .conf-bar { flex: 1; height: 4px; background: #2d1b69; border-radius: 2px; overflow: hidden; }
    .conf-fill { height: 100%; background: linear-gradient(90deg, #7c3aed, #a855f7); border-radius: 2px; }

    /* Signals */
    .signals-title { font-size: 11px; color: #64748b; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
    .signal-item {
      display: flex; align-items: flex-start; gap: 6px;
      padding: 6px 8px;
      background: #1a0d35;
      border-radius: 5px;
      margin-bottom: 4px;
    }
    .signal-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
    .signal-label { font-size: 11px; color: #cbd5e1; }
    .signal-weight { font-size: 10px; color: #64748b; margin-left: auto; flex-shrink: 0; }

    /* No-signals */
    .no-signals { font-size: 11px; color: #475569; text-align: center; padding: 8px; }

    /* Footer actions */
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions .btn { flex: 1; text-align: center; font-size: 11px; padding: 7px; }

    /* Error */
    .error-box {
      background: #1a0d35; border: 1px solid #7f1d1d;
      border-radius: 6px; padding: 10px 12px;
      color: #fca5a5; font-size: 11px;
    }

    .footer {
      padding: 8px 16px;
      border-top: 1px solid rgba(168, 85, 247, 0.15);
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer-email { font-size: 10px; color: #475569; }
    .footer-settings { font-size: 10px; color: #a855f7; cursor: pointer; }
    .footer-settings:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <img src="../icons/icon48.png" alt="" class="header-logo" width="26" height="26" />
    <span class="header-title">Neural Shield</span>
    <span class="header-badge">AI</span>
    <span class="header-sub" id="engineVersion"></span>
  </div>

  <div class="body">
    <div class="url-strip" id="urlStrip">Loading current page…</div>
    <div id="main"></div>
  </div>

  <div class="footer">
    <span class="footer-email" id="footerEmail"></span>
    <span class="footer-settings" id="settingsLink">Settings</span>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
