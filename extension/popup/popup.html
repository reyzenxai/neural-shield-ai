<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural Shield AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #0f172a;
      color: #e2e8f0;
    }
    .header {
      background: linear-gradient(135deg, #1e40af, #312e81);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-icon {
      width: 22px; height: 22px;
      background: #60a5fa;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: bold; color: #1e40af;
      flex-shrink: 0;
    }
    .header-title { font-size: 14px; font-weight: 600; color: #fff; }
    .header-sub { font-size: 10px; color: #93c5fd; margin-left: auto; }

    .body { padding: 14px 16px; }

    /* URL strip */
    .url-strip {
      background: #1e293b;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      color: #94a3b8;
    }

    /* Sign-in prompt */
    .signin-box { text-align: center; padding: 16px 0; }
    .signin-box p { color: #94a3b8; margin-bottom: 12px; font-size: 12px; }
    .btn {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-outline { background: transparent; border: 1px solid #334155; color: #94a3b8; }
    .btn-danger { background: #ef4444; color: #fff; }

    /* Loading */
    .loading { text-align: center; padding: 24px; color: #64748b; font-size: 12px; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #1e293b;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Verdict card */
    .verdict-card {
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      border-left: 4px solid var(--risk-color, #6b7280);
      background: #1e293b;
    }
    .verdict-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .verdict-badge {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: var(--risk-color, #6b7280);
      color: #fff;
    }
    .verdict-score { font-size: 11px; color: #64748b; margin-left: auto; }
    .verdict-label { font-size: 13px; font-weight: 600; color: #f1f5f9; }

    /* Confidence bar */
    .conf-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .conf-label { font-size: 10px; color: #64748b; width: 60px; flex-shrink: 0; }
    .conf-bar { flex: 1; height: 4px; background: #334155; border-radius: 2px; overflow: hidden; }
    .conf-fill { height: 100%; background: #3b82f6; border-radius: 2px; }

    /* Signals */
    .signals-title { font-size: 11px; color: #64748b; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
    .signal-item {
      display: flex; align-items: flex-start; gap: 6px;
      padding: 6px 8px;
      background: #1e293b;
      border-radius: 5px;
      margin-bottom: 4px;
    }
    .signal-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
    .signal-label { font-size: 11px; color: #cbd5e1; }
    .signal-weight { font-size: 10px; color: #64748b; margin-left: auto; flex-shrink: 0; }

    /* No-signals */
    .no-signals { font-size: 11px; color: #475569; text-align: center; padding: 8px; }

    /* Footer actions */
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions .btn { flex: 1; text-align: center; font-size: 11px; padding: 7px; }

    /* Error */
    .error-box {
      background: #1e293b; border: 1px solid #7f1d1d;
      border-radius: 6px; padding: 10px 12px;
      color: #fca5a5; font-size: 11px;
    }

    .footer {
      padding: 8px 16px;
      border-top: 1px solid #1e293b;
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer-email { font-size: 10px; color: #475569; }
    .footer-settings { font-size: 10px; color: #3b82f6; cursor: pointer; }
    .footer-settings:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">NS</div>
    <span class="header-title">Neural Shield</span>
    <span class="header-sub" id="engineVersion"></span>
  </div>

  <div class="body">
    <div class="url-strip" id="urlStrip">Loading current page…</div>
    <div id="main"></div>
  </div>

  <div class="footer">
    <span class="footer-email" id="footerEmail"></span>
    <span class="footer-settings" id="settingsLink">Settings</span>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
